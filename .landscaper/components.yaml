components:
  - name: github.com/openmcp-project/landscaper/helm-deployer
    version: ${VERSION}
    provider:
      name: ${PROVIDER}
    resources:
      - name: helm-deployer-blueprint
        type: landscaper.gardener.cloud/blueprint
        input:
          type: Dir/v1
          path: ./.landscaper/helm-deployer/blueprint
          compress: true
          mediaType: application/vnd.gardener.landscaper.blueprint.v1+tar+gzip
      - name: helm-deployer-chart
        type: helmChart
        input:
          type: Helm/v1
          path: ${HELM_DEPLOYER_CHART_PATH}
      - name: helm-deployer-image
        type: ociImage
        version: ${VERSION}
        access:
          type: OCIImage/v1
          imageReference: "${IMAGE_REGISTRY}/helm-deployer-controller:${VERSION}"

  - name: github.com/openmcp-project/landscaper/manifest-deployer
    version: ${VERSION}
    provider:
      name: ${PROVIDER}
    resources:
      - name: manifest-deployer-blueprint
        type: landscaper.gardener.cloud/blueprint
        input:
          type: Dir/v1
          path: ./.landscaper/manifest-deployer/blueprint
          compress: true
          mediaType: application/vnd.gardener.landscaper.blueprint.v1+tar+gzip
      - name: manifest-deployer-chart
        type: helmChart
        input:
          type: Helm/v1
          path: ${MANIFEST_DEPLOYER_CHART_PATH}
      - name: manifest-deployer-image
        type: ociImage
        version: ${VERSION}
        access:
          type: OCIImage/v1
          imageReference: "${IMAGE_REGISTRY}/manifest-deployer-controller:${VERSION}"

  - name: github.com/openmcp-project/landscaper/container-deployer
    version: ${VERSION}
    provider:
      name: ${PROVIDER}
    resources:
      - name: container-deployer-blueprint
        type: landscaper.gardener.cloud/blueprint
        input:
          type: Dir/v1
          path: ./.landscaper/container-deployer/blueprint
          compress: true
          mediaType: application/vnd.gardener.landscaper.blueprint.v1+tar+gzip
      - name: container-deployer-chart
        type: helmChart
        input:
          type: Helm/v1
          path: ${CONTAINER_DEPLOYER_CHART_PATH}
      - name: container-deployer-image
        type: ociImage
        version: ${VERSION}
        access:
          type: OCIImage/v1
          imageReference: "${IMAGE_REGISTRY}/container-deployer-controller:${VERSION}"
      - name: container-init-image
        type: ociImage
        version: ${VERSION}
        access:
          type: OCIImage/v1
          imageReference: "${IMAGE_REGISTRY}/container-deployer-init:${VERSION}"
      - name: container-wait-image
        type: ociImage
        version: ${VERSION}
        access:
          type: OCIImage/v1
          imageReference: "${IMAGE_REGISTRY}/container-deployer-wait:${VERSION}"

  - name: github.com/openmcp-project/landscaper/mock-deployer
    version: ${VERSION}
    provider:
      name: ${PROVIDER}
    resources:
      - name: mock-deployer-blueprint
        type: landscaper.gardener.cloud/blueprint
        input:
          type: Dir/v1
          path: ./.landscaper/mock-deployer/blueprint
          compress: true
          mediaType: application/vnd.gardener.landscaper.blueprint.v1+tar+gzip
      - name: mock-deployer-chart
        type: helmChart
        input:
          type: Helm/v1
          path: ${MOCK_DEPLOYER_CHART_PATH}
      - name: mock-deployer-image
        type: ociImage
        version: ${VERSION}
        access:
          type: OCIImage/v1
          imageReference: "${IMAGE_REGISTRY}/mock-deployer-controller:${VERSION}"

  - name: github.com/openmcp-project/landscaper
    version: ${VERSION}
    provider:
      name: ${PROVIDER}
    componentReferences:
      - name: helm-deployer
        componentName: github.com/openmcp-project/landscaper/helm-deployer
        version: ${VERSION}
      - name: manifest-deployer
        componentName: github.com/openmcp-project/landscaper/manifest-deployer
        version: ${VERSION}
      - name: container-deployer
        componentName: github.com/openmcp-project/landscaper/container-deployer
        version: ${VERSION}
      - name: mock-deployer
        componentName: github.com/openmcp-project/landscaper/mock-deployer
        version: ${VERSION}
    resources:
      - name: landscaper-chart
        type: helmChart
        input:
          type: Helm/v1
          path: ${LANDSCAPER_CHART_PATH}
      - name: landscaper-controller-rbac-chart
        type: helmChart
        input:
          type: Helm/v1
          path: ${LANDSCAPER_CONTROLLER_RBAC_CHART_PATH}
      - name: landscaper-controller-deployment-chart
        type: helmChart
        input:
          type: Helm/v1
          path: ${LANDSCAPER_CONTROLLER_DEPLOYMENT_CHART_PATH}
      - name: landscaper-controller
        type: ociImage
        version: ${VERSION}
        access:
          type: OCIImage/v1
          imageReference: "${IMAGE_REGISTRY}/landscaper-controller:${VERSION}"
      - name: landscaper-webhooks-server
        type: ociImage
        version: ${VERSION}
        access:
          type: OCIImage/v1
          imageReference: "${IMAGE_REGISTRY}/landscaper-webhooks-server:${VERSION}"
