- name: one
  type: GoTemplate
  template: |
    deployItems:
    - name: init
      type: container
      config:
        apiVersion: example.test/v1
        kind: Configuration
        {{- $oci := getImageReference (getResource .cd "name" "ociimage") }}
        {{- $blob := getImageReference (getResource .cd "name" "blobimage") }}
        image1: "{{ $oci.repository }}:{{ $oci.tag }}"
        image2: "{{ $blob.repository }}@{{ $blob.digest }}"
        reference2: {{ $blob.reference }}
        # an unset tag or digest is an empty string, not a missing key
        digest1: "{{ $oci.digest }}"
        tag2: "{{ $blob.tag }}"
