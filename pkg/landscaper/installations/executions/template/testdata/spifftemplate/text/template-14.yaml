- name: one
  type: Spiff
  template: |
    deployItems:
    - name: oci
      type: container
      config:
        apiVersion: example.test/v1
        kind: Configuration
        ref: (( &temporary( toOCI(getResource(cd, "name", "ociimage")) ) ))
        image: (( ref.repository ":" ref.tag ))
        reference: (( ref.reference ))
        # an unset digest is an empty string, not a missing key
        digest: (( ref.digest ))
    - name: blob
      type: container
      config:
        apiVersion: example.test/v1
        kind: Configuration
        ref: (( &temporary( toOCI(getResource(cd, "name", "blobimage")) ) ))
        image: (( ref.repository "@" ref.digest ))
        reference: (( ref.reference ))
        tag: (( ref.tag ))
